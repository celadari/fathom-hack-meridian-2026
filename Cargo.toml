[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
# Pinned to 28.0.0: rs-soroban-ultrahonk and soroban-poseidon both require the 28.x SDK.
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
