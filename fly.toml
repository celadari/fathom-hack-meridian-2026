# Always-on demo server. Deploy:
#   fly launch --no-deploy --copy-config --name fathom-demo
#   fly volumes create fathom_state --size 1 --region mad
#   (cd scripts && npx tsx export-demo-secrets.ts) | fly secrets import
#   fly secrets set DEMO_TOKEN=$(openssl rand -hex 24) ALLOWED_ORIGINS=https://<your-app>.vercel.app
#   fly deploy
app = "fathom-demo"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"   # the auction loop must keep running
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[mounts]]
  source = "fathom_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
