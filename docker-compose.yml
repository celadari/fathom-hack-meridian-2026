# Fathom, full demo on localhost.
#
#   cp .env.example .env.local && (cd scripts && npx tsx export-demo-secrets.ts >> ../.env.local)
#   docker compose up -d --build          # http://localhost:8080 (add ?demo for the demo bar)
#
# Profiles:
#   dev    app-dev: Vite with hot reload on http://localhost:5173 (instead of the nginx build)
#   local  stellar/quickstart local network + a demo server pointed at it (default network: testnet)
#
# Keys: FATHOM_KEY_* in .env.local (gitignored). Ports are published on 127.0.0.1 only.
name: fathom

x-demo-server: &demo-server
  build: { context: ., dockerfile: docker/demo-server.Dockerfile }
  image: fathom/demo-server:local
  env_file: [{ path: .env.local, required: true }]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3

services:
  demo-server:
    <<: *demo-server
    environment:
      DEMO_LOCAL_ONLY: "1" # no token needed: only reachable through 127.0.0.1 and the app's proxy
    volumes: [demo-state:/data]
    ports: ["127.0.0.1:8787:8787"]

  app:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    image: fathom/app:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on: { demo-server: { condition: service_healthy } }
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  app-dev:
    profiles: [dev]
    image: node:24.8.0-slim
    user: node
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      DEMO_PROXY_TARGET: ${DEMO_PROXY_TARGET:-http://demo-server:8787} # local network: http://demo-server-local:8787
    volumes:
      - ./app:/app
      - app-dev-modules:/app/node_modules
    ports: ["127.0.0.1:5173:5173"]
    depends_on: { demo-server: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  stellar:
    profiles: [local]
    image: stellar/quickstart:v685-b1563.1-latest
    # Protocol 29 to match testnet; unlimited Soroban limits so the verifier demo fits locally too.
    command: ["--local", "--protocol-version", "29", "--limits", "unlimited", "--enable", "core,horizon,rpc"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  demo-server-local:
    <<: *demo-server
    profiles: [local]
    environment:
      DEMO_LOCAL_ONLY: "1"
      FATHOM_NETWORK: local
      FATHOM_RPC_URL: http://stellar:8000/rpc
      FATHOM_HORIZON_URL: http://stellar:8000
      FATHOM_FRIENDBOT_URL: http://stellar:8000/friendbot
    volumes:
      - demo-state-local:/data
      - ./deployments:/app/deployments:ro
    ports: ["127.0.0.1:8788:8787"]
    depends_on: { stellar: { condition: service_healthy } }

volumes:
  demo-state:
  demo-state-local:
  app-dev-modules:
